spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/kisanmitra;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
server:
  port: ${PORT:5000}
app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-characters}
    expiration: ${JWT_EXPIRATION:2592000000}
  client-url: ${CLIENT_URL:http://localhost:5173}
