services:
  postgres:
    image: postgres:16-alpine
    container_name: kisanmitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kisanmitra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kisanmitra-postgres-data:/var/lib/postgresql/data
volumes:
  kisanmitra-postgres-data:
